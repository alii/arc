name: aot

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'aot/**'
      - 'src/**'
      - 'gleam.toml'
      - '.github/workflows/aot.yml'
  pull_request:
    paths:
      - 'aot/**'
      - 'src/**'
      - 'gleam.toml'
      - '.github/workflows/aot.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aot
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          gleam-version: '1.17'
          rebar3-version: '3'
      - run: gleam deps download
      - run: gleam build
      - run: gleam test
      - run: gleam format --check src test
