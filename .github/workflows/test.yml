name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          gleam-version: '1.18'
          rebar3-version: '3'
          # elixir-version: "1"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
      - name: root package must not import twocore
        run: "! grep -rn 'import twocore' src test"
